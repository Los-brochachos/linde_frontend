
<header class="flex h-16 items-center justify-between border-b border-slate-200 bg-[#002d54] px-6">

  <div>
    <h1 class="text-lg font-semibold text-white">
      Panel de control
    </h1>
  </div>

  <div class="flex items-center gap-4">

    <!-- Notificaciones -->
    <span class="text-xl text-white" title="Notificaciones">
      <i class="bi bi-bell"></i>
    </span>

    <!-- Menú PrimeNG -->
    <p-menu
      #menu
      [model]="items"
      [popup]="true"
      appendTo="body"
    />


    <!-- Botón que abre el menú -->
    @if (usuario(); as user) {

      <button
        type="button"
        (click)="menu.toggle($event)"
        class="flex items-center gap-3 rounded-lg p-2 text-white hover:bg-white/10"
        aria-label="Opciones de usuario"
      >

        <!-- Avatar -->
        <div class="flex h-10 w-10 items-center justify-center rounded-full bg-sky-100 font-semibold text-sky-700">
          {{ user.correo.charAt(0).toUpperCase() }}
        </div>

        <!-- Datos del usuario -->
        <div class="hidden text-left md:block">
          <p class="max-w-48 truncate text-sm font-medium text-white">
            {{ user.correo }}
          </p>

          <p class="text-xs text-slate-300">
            {{ user.rol }}
          </p>
        </div>

        <i class="bi bi-chevron-down text-xs text-white"></i>

      </button>

    }

  </div>

</header>
