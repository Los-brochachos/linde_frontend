
<header class="relative z-30 flex h-16 w-full items-center justify-between border-b border-white/10 bg-[#002d54] px-4 shadow-sm sm:px-6 lg:h-18 lg:px-8">

  <!-- TÍTULO DEL DASHBOARD -->
  <div class="flex min-w-0 items-center gap-3">

    <div class="hidden h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-white/10 bg-white/10 sm:flex">
      <i class="pi pi-th-large text-lg text-sky-200"></i>
    </div>

    <div class="min-w-0">
      <h1 class="truncate text-base font-semibold tracking-tight text-white sm:text-lg">Panel de control</h1>
      <p class="hidden text-xs text-blue-200/80 sm:block">Sistema de Monitoreo de Atención</p>
    </div>

  </div>

  <!-- ACCIONES DEL HEADER -->
  <div class="flex shrink-0 items-center gap-2 sm:gap-3">

    <!-- NOTIFICACIONES -->
    <button type="button" aria-label="Notificaciones" title="Notificaciones" class="relative flex h-10 w-10 items-center justify-center rounded-xl text-white transition-all duration-200 hover:bg-white/10 active:scale-95">
      <i class="bi bi-bell text-xl"></i>
    </button>

    <!-- SEPARADOR -->
    <div class="mx-1 hidden h-8 w-px bg-white/15 sm:block"></div>

    <!-- MENÚ DESPLEGABLE -->
    <p-menu #menu [model]="items()" [popup]="true" appendTo="body" styleClass="without-user-menu">

      <!-- INFORMACIÓN DE CUENTA -->
      <ng-template #start>
        @if (usuario(); as user) {
          <div class="mb-1 border-b border-slate-200 bg-white px-4 py-3">

            <div class="flex items-center gap-3">

              <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full bg-sky-100 text-base font-bold text-[#002d54]">
                {{ user.correo.charAt(0).toUpperCase() }}
              </div>

              <div class="min-w-0 flex-1">
                <p class="text-sm font-semibold text-slate-800">Mi cuenta</p>
                <p class="truncate text-xs text-slate-500">{{ user.correo }}</p>
                <span class="mt-1 inline-flex rounded-md bg-blue-50 px-2 py-0.5 text-[11px] font-semibold capitalize text-[#007ac3]">{{ user.rol.toLowerCase() }}</span>
              </div>

            </div>

          </div>
        }
      </ng-template>

      <!-- OPCIONES DEL MENÚ -->
      <ng-template #item let-item>
        <a pRipple [routerLink]="item.routerLink || null" (click)="item.command?.({ originalEvent: $event, item: item })" class="without-menu-link flex w-full cursor-pointer items-center gap-3 text-sm font-medium transition-colors duration-150" [class.text-red-600]="item.label === 'Cerrar sesión'" [class.text-slate-700]="item.label !== 'Cerrar sesión'">
          <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg" [class.bg-red-50]="item.label === 'Cerrar sesión'" [class.bg-sky-50]="item.label !== 'Cerrar sesión'">
            <i [class]="item.icon" [class.text-red-500]="item.label === 'Cerrar sesión'" [class.text-[#007ac3]]="item.label !== 'Cerrar sesión'"></i>
          </span>

          <span class="min-w-0 flex-1">{{ item.label }}</span>

          @if (item.label !== 'Cerrar sesión') {
            <i class="pi pi-chevron-right text-[10px] text-slate-400"></i>
          }

        </a>
      </ng-template>

    </p-menu>

    <!-- BOTÓN DE PERFIL -->
    @if (usuario(); as user) {

      <button type="button" (click)="menu.toggle($event)" aria-label="Opciones de usuario" aria-haspopup="menu" class="group flex min-w-0 items-center gap-2 rounded-xl border border-transparent px-1.5 py-1.5 text-white transition-all duration-200 hover:border-white/10 hover:bg-white/10 sm:gap-3 sm:px-3">

        <!-- AVATAR -->
        <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full border-2 border-white/20 bg-sky-100 text-sm font-bold text-[#002d54] shadow-sm">
          {{ user.correo.charAt(0).toUpperCase() }}
        </div>

        <!-- DATOS DEL USUARIO -->
        <div class="hidden min-w-0 max-w-48 text-left md:block">
          <p class="truncate text-sm font-semibold leading-5 text-white">{{ user.correo }}</p>

          <div class="mt-0.5 flex items-center gap-1.5">
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>
            <span class="truncate text-xs capitalize text-blue-200">{{ user.rol.toLowerCase() }}</span>
          </div>
        </div>

        <i class="bi bi-chevron-down hidden text-xs text-blue-200 transition-transform duration-200 group-hover:translate-y-0.5 sm:block"></i>

      </button>

    }

  </div>

</header>
