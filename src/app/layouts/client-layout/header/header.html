<header class="w-full bg-[#002d54] text-white">
  <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-5 px-6 py-4">
    <a routerLink="/cliente/inicio" aria-label="Linde, inicio del cliente" class="block w-28 shrink-0 md:w-36">
      <img src="/images/logos/linde-logo-desktop.avif" alt="Linde" class="w-full" />
    </a>
    <nav aria-label="Portal del cliente" class="flex flex-wrap items-center gap-4 text-sm font-medium">
      <a routerLink="/cliente/inicio" routerLinkActive="underline" [routerLinkActiveOptions]="{exact: true}" ariaCurrentWhenActive="page" class="underline-offset-8">Inicio</a>
      <a routerLink="/cliente/pedidos" routerLinkActive="underline" ariaCurrentWhenActive="page" class="underline-offset-8">Mis pedidos</a>
      <a routerLink="/cliente/citas" routerLinkActive="underline" ariaCurrentWhenActive="page" class="underline-offset-8">Citas</a>
      <a routerLink="/cliente/seguimiento" routerLinkActive="underline" ariaCurrentWhenActive="page" class="underline-offset-8">Seguimiento</a>
      <a routerLink="/cliente/productos" routerLinkActive="underline" ariaCurrentWhenActive="page" class="underline-offset-8">Productos</a>
      <a routerLink="/cliente/perfil" routerLinkActive="underline" ariaCurrentWhenActive="page" class="underline-offset-8">Mi perfil</a>
    </nav>
    <div class="flex items-center gap-3">
      <span class="max-w-48 truncate text-xs text-slate-200">{{ usuario()?.correo }}</span>
      <p-button label="Cerrar sesión" severity="danger" (onClick)="abrirConfirmacion()" />
    </div>
  </div>
  <p-dialog header="Cerrar sesión" [(visible)]="mostrarModalConfirmacion" [modal]="true" [style]="{width:'26rem'}" [breakpoints]="{'640px':'95vw'}" [closable]="!cerrando" [closeOnEscape]="!cerrando" [draggable]="false">
    <p>¿Estás seguro de que quieres cerrar sesión?</p>
    @if (error) { <p role="alert" class="mt-3 text-red-700">{{ error }}</p> }
    <div class="mt-6 flex justify-end gap-3">
      <p-button label="Cancelar" severity="secondary" [disabled]="cerrando" (onClick)="cancelarCierre()" />
      <p-button label="Aceptar" severity="danger" [loading]="cerrando" (onClick)="aceptarCierre()" />
    </div>
  </p-dialog>
</header>
