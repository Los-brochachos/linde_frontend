<header class="w-full bg-[#002d54] lg:h-20 h-15">

    <nav class="w-full h-full max-w-7xl mx-auto flex justify-center">

    <!-- ========================= -->
    <!-- LOGO -->
    <!-- ========================= -->
        <a routerLink="/cliente/inicio" class="relative w-27 md:w-36 lg:w-49 ml-4">
            <img src="/images/logos/linde-logo-mobile.avif" class="absolute md:hidden  shadow-[0_4px_4px_#00000040]" alt="Linde">
            <img src="/images/logos/linde-logo-tablet.avif" class="hidden md:block md:absolute lg:hidden  shadow-[0_4px_4px_#00000040]" alt="Linde">
            <img src="/images/logos/linde-logo-desktop.avif" class="hidden lg:block lg:absolute  shadow-[0_4px_4px_#00000040]" alt="Linde">

        </a>

        <div class="flex-1 flex flex-col h-full px-4">

            <!-- Barra superior -->
            <div class="hidden lg:flex flex-1 items-center justify-between text-sm">

                <span class="font-medium text-white">
                Perú
                </span>

                <div class="flex items-center gap-6">

                <a routerLink="/contacto" class="text-gray-500 hover:text-blue-700 transition-colors">
                    Servicio al cliente
                </a>

                <a href="https://www.linde.com" target="_blank" rel="noopener noreferrer" class="text-gray-500 hover:text-blue-700 transition-colors">
                    Linde Corporativo
                </a>

                </div>
            </div>


            <!-- Navegación principal -->
            <div class="flex-1 lg:flex items-center justify-between">
                    <!-- Links desktop -->
                    <div class="hidden lg:flex items-center gap-8  text-white ">
                        <a routerLink="/cliente/inicio" routerLinkActive="" class="font-medium  hover:underline underline-offset-8 transition-colors">Inicio</a>
                        <a routerLink="/cliente/citas" routerLinkActive="" class="font-medium  hover:underline underline-offset-8 transition-colors">Citas</a>
                        <a routerLink="/cliente/seguimiento" routerLinkActive="" class="font-medium hover:underline underline-offset-8 transition-colors">Seguimiento </a>
                    </div>

                    <!-- Acciones -->
                    <div class="hidden ml-auto lg:flex items-center gap-2">

                    <!-- SE REMOVIÓ EL routerLink Y SE ASIGNÓ EL EVENTO (click) -->
                    <button type="button" (click)="abrirConfirmacion()" pButton class="bg-red-600! border-0! text-white! hover:bg-[#005491]!">
                    <!-- <a routerLink="/login" class="hidden lg:flex items-center px-5 py-2.5bg-blue-700  text-white font-medium hover:bg-blue-800 transition-colors"> -->
                        Cerrar sesion
                    <!-- </a> -->
                    </button>


                    <!-- Menú móvil -->
                    <button type="button" class="lg:hidden w-11 h-11 flex items-center justify-center text-gray-700" aria-label="Abrir menú">
                        <i class="pi pi-bars text-2xl">dad</i>
                    </button>

                </div>

            </div>

        </div>

  </nav>

  <!-- ========================================================================= -->
  <!-- ANUNCIO FLOTANTE DE CONFIRMACIÓN (MODAL TAILWIND NATIVO) -->
  <!-- ========================================================================= -->
  <div *ngIf="mostrarModalConfirmacion" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm animate-fade-in">
    
    <!-- Caja del Modal -->
    <div class="bg-white rounded-lg shadow-xl border border-gray-200 max-w-sm w-full mx-4 overflow-hidden">
      
      <!-- Encabezado del aviso -->
      <div class="bg-[#002d54] px-6 py-4 flex items-center gap-3 text-white">
        <i class="pi pi-exclamation-triangle text-xl text-yellow-400"></i>
        <h3 class="text-lg font-semibold tracking-wide">Confirmación</h3>
      </div>

      <!-- Cuerpo del mensaje -->
      <div class="p-6">
        <p class="text-gray-600 text-sm font-medium leading-relaxed">
          ¿Estás seguro que quieres cerrar sesión?
        </p>
      </div>

      <!-- Botones de Acción inferior -->
      <div class="px-6 py-4 bg-gray-50 flex justify-end gap-3 border-t border-gray-100">
        
        <!-- Botón Cancelar -->
        <button type="button" 
                (click)="cancelarCierre()" 
                class="px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-200 rounded transition-colors">
          Cancelar
        </button>

        <!-- Botón Aceptar -->
        <button type="button" 
                (click)="aceptarCierre()" 
                class="px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded shadow-sm transition-colors">
          Aceptar
        </button>

      </div>

    </div>

  </div>

</header>
